<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SplitPay</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 28rem; margin: 3rem auto; padding: 0 1rem; color: #1a1a1a; background: #fafafa; }
    label { display: block; margin-top: 1rem; }
    input { width: 100%; padding: .5rem; font-size: 1rem; }
    button { margin-top: 1.25rem; padding: .6rem 1.2rem; font-size: 1rem; }
    #result { margin-top: 1.25rem; font-weight: 600; }
    #error { margin-top: 1rem; color: #a40000; }
  </style>
</head>
<body>
  <main>
    <h1>SplitPay</h1>
    <form id="split-form" novalidate>
      <label for="total">Bill total (₹)</label>
      <input id="total" name="total" type="number" min="0" step="0.01" required>
      <label for="people">Number of people</label>
      <input id="people" name="people" type="number" min="1" step="1" required>
      <!-- The demo renames this label on purpose to break locators: keep the id stable. -->
      <button id="split" type="submit">Split bill</button>
    </form>
    <p id="result" role="status" aria-live="polite"></p>
    <p id="error" role="alert"></p>
  </main>
  <script>
    document.getElementById("split-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const total = Number(document.getElementById("total").value);
      const people = Number(document.getElementById("people").value);
      const result = document.getElementById("result");
      const error = document.getElementById("error");
      result.textContent = "";
      error.textContent = "";
      if (!Number.isInteger(people) || people < 1) {
        error.textContent = "Enter at least 1 person.";
        return;
      }
      const share = Math.round((total / people) * 100) / 100;
      result.textContent = `Each person pays ₹${share.toFixed(2)}`;
    });
  </script>
</body>
</html>
